[workspace]
resolver = "3"
members = [
    "crates/kube-log-core",
    "crates/kube-log-tui",
    "crates/kube-log-cli",
]

[workspace.package]
version = "0.5.11"
edition = "2024"

[workspace.dependencies]
# Internal
kube-log-core = { path = "crates/kube-log-core" }

# Shared
anyhow = "1.0.105"
futures = "0.3.34"
jiff = "1.0.2"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", features = ["client", "config", "runtime", "rustls-tls"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"

# TUI
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
libc = "0.2.189"
ratatui = "0.30.2"
toml = "1.1.4"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
