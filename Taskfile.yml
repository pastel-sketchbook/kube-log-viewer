version: "3"

tasks:
  default:
    desc: "List all available tasks"
    cmds:
      - task --list-all

  # --- Core Development ---
  fmt:
    desc: "Format all Rust code"
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: "Check Rust formatting"
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: "Run clippy with warnings as errors"
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  cargo:check:
    desc: "Compile-check the workspace"
    cmds:
      - cargo check --workspace --all-targets

  build:
    desc: "Build in debug mode"
    deps: [fmt]
    cmds:
      - cargo build --workspace

  build:release:
    desc: "Build optimized release binary"
    deps: [check:all]
    cmds:
      - cargo build --workspace --release

  check:
    desc: "Run the full local check suite"
    cmds:
      - task: check:all

  test:
    desc: "Run all tests"
    cmds:
      - cargo test --workspace

  test:verbose:
    desc: "Run tests with output visible (--nocapture)"
    cmds:
      - cargo test --workspace -- --nocapture

  check:all:
    desc: "Run version check, format check, lint, and tests"
    cmds:
      - task: version:check
      - task: fmt:check
      - task: cargo:check
      - task: lint
      - task: test

  cargo:upgrade:
    desc: "Upgrade Cargo.toml dependency requirements with cargo-edit"
    cmds:
      - cargo upgrade

  cargo:upgrade:check:
    desc: "Preview Cargo.toml dependency requirement upgrades"
    cmds:
      - cargo upgrade --dry-run

  # --- Run ---
  run:
    desc: "Run kube-log-viewer"
    cmds:
      - cargo run --package kube-log-tui

  run:release:
    desc: "Run kube-log-viewer (release build)"
    cmds:
      - cargo run --package kube-log-tui --release

  run:cli:
    desc: "Run kube-log CLI"
    cmds:
      - cargo run --package kube-log-cli --

  run:cli:release:
    desc: "Run kube-log CLI (release build)"
    cmds:
      - cargo run --package kube-log-cli --release --

  # --- Install ---
  install:
    desc: "Install kube-log-viewer and kube-log to ~/.cargo/bin"
    deps: [check:all]
    cmds:
      - cargo install --path crates/kube-log-tui --force
      - cargo install --path crates/kube-log-cli --force

  # --- Versioning ---
  version:show:
    desc: "Show current version"
    cmds:
      - echo "Current version $(tr -d '[:space:]' < VERSION)"

  version:validate:
    desc: "Validate VERSION file contains valid semver (X.Y.Z)"
    internal: true
    cmds:
      - |
        set -e
        VERSION=$(tr -d '[:space:]' < VERSION)
        case "$VERSION" in
          *[!0-9.]*|*.*.*.*|.*|*.) echo "ERROR: VERSION file contains invalid semver: '$VERSION'"; exit 1 ;;
        esac
        IFS='.' read -r MAJOR MINOR PATCH <<EOF
        $VERSION
        EOF
        if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
          echo "ERROR: VERSION file contains invalid semver: '$VERSION'"
          exit 1
        fi

  version:check:
    desc: "Verify VERSION, Cargo.toml, and Cargo.lock all agree"
    cmds:
      - task: version:validate
      - |
        set -e
        VERSION=$(tr -d '[:space:]' < VERSION)
        OK=true
        CARGO_VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
        if [ "$VERSION" != "$CARGO_VERSION" ]; then
          echo "MISMATCH: VERSION=$VERSION but Cargo.toml [workspace.package]=$CARGO_VERSION"
          OK=false
        fi
        for f in crates/kube-log-core/Cargo.toml crates/kube-log-tui/Cargo.toml crates/kube-log-cli/Cargo.toml; do
          if ! grep -q '^version\.workspace = true$' "$f"; then
            echo "MISMATCH: $f does not inherit version.workspace = true"
            OK=false
          fi
        done
        for name in kube-log-core kube-log-tui kube-log-cli; do
          LOCK_VERSION=$(awk -v name="$name" '$0 == "name = \"" name "\"" { getline; sub(/^version = \"/, ""); sub(/\"$/, ""); print; exit }' Cargo.lock)
          if [ "$VERSION" != "$LOCK_VERSION" ]; then
            echo "MISMATCH: VERSION=$VERSION but Cargo.lock $name=$LOCK_VERSION"
            OK=false
          fi
        done
        if [ "$OK" = true ]; then
          echo "All files agree: $VERSION"
        else
          echo "Run 'task version:sync' to fix"
          exit 1
        fi

  version:sync:
    desc: "Sync Cargo.toml and Cargo.lock to match VERSION file"
    cmds:
      - task: version:validate
      - |
        set -e
        VERSION=$(tr -d '[:space:]' < VERSION)
        sed -i.bak "/^\[workspace\.package\]/,/^\[/s/^version = \"[^\"]*\"/version = \"$VERSION\"/" Cargo.toml
        rm -f Cargo.toml.bak
        cargo update --workspace
        echo "All versions synced to $VERSION"

  version:bump:
    desc: "Bump VERSION by level and sync Cargo files"
    internal: true
    cmds:
      - task: version:validate
      - |
        set -e
        LEVEL="{{.LEVEL}}"
        VERSION=$(tr -d '[:space:]' < VERSION)
        IFS='.' read -r MAJOR MINOR PATCH <<EOF
        $VERSION
        EOF
        case "$LEVEL" in
          patch) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
          major) NEXT="$((MAJOR + 1)).0.0" ;;
          *) echo "Usage: task version:bump LEVEL=[patch|minor|major]"; exit 1 ;;
        esac
        printf '%s\n' "$NEXT" > VERSION
        echo "Bumped VERSION to $NEXT"
      - task: version:sync

  version:patch:
    desc: "Bump patch version (0.1.0 -> 0.1.1)"
    cmds:
      - task: version:bump
        vars: { LEVEL: patch }

  version:minor:
    desc: "Bump minor version (0.1.0 -> 0.2.0)"
    cmds:
      - task: version:bump
        vars: { LEVEL: minor }

  version:major:
    desc: "Bump major version (0.1.0 -> 1.0.0)"
    cmds:
      - task: version:bump
        vars: { LEVEL: major }

  version:tag:
    desc: "Git tag current version as v<version>"
    cmds:
      - |
        set -e
        VERSION=$(tr -d '[:space:]' < VERSION)
        git tag "v$VERSION"
        echo "Tagged v$VERSION"

  # --- Release & Distribution ---
  release:
    desc: "Bump patch, commit, tag, and push to trigger release workflow"
    cmds:
      - task: version:patch
      - |
        set -e
        VERSION=$(tr -d '[:space:]' < VERSION)
        git add VERSION Cargo.toml Cargo.lock
        git commit -m "chore: bump version to $VERSION"
        git tag "v$VERSION"
        git push && git push origin "v$VERSION"
        echo "Pushed v$VERSION — release workflow triggered"

  release:minor:
    desc: "Bump minor, commit, tag, and push to trigger release workflow"
    cmds:
      - task: version:minor
      - |
        set -e
        VERSION=$(tr -d '[:space:]' < VERSION)
        git add VERSION Cargo.toml Cargo.lock
        git commit -m "chore: bump version to $VERSION"
        git tag "v$VERSION"
        git push && git push origin "v$VERSION"
        echo "Pushed v$VERSION — release workflow triggered"

  release:major:
    desc: "Bump major, commit, tag, and push to trigger release workflow"
    cmds:
      - task: version:major
      - |
        set -e
        VERSION=$(tr -d '[:space:]' < VERSION)
        git add VERSION Cargo.toml Cargo.lock
        git commit -m "chore: bump version to $VERSION"
        git tag "v$VERSION"
        git push && git push origin "v$VERSION"
        echo "Pushed v$VERSION — release workflow triggered"

  # --- Code Quality ---
  loc:
    desc: "Show lines of code statistics using tokei"
    cmds:
      - tokei

  clean:
    desc: "Remove build artifacts"
    cmds:
      - cargo clean
