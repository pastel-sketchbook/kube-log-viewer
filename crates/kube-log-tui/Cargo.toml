[package]
name = "kube-log-tui"
version = "0.5.10"
edition = "2024"
description = "A terminal UI for streaming and searching Kubernetes pod logs"

[[bin]]
name = "kube-log-viewer"
path = "src/main.rs"

[dependencies]
kube-log-core = { path = "../kube-log-core" }
anyhow = "1.0.104"
jiff = "0.2.35"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", features = ["client", "config", "runtime", "rustls-tls"] }
libc = "0.2.189"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
