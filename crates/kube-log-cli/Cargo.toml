[package]
name = "kube-log-cli"
version = "0.5.10"
edition = "2024"
description = "LLM-facing CLI for Kubernetes log analysis with anomaly detection"

[[bin]]
name = "kube-log"
path = "src/main.rs"

[dependencies]
kube-log-core = { path = "../kube-log-core" }
anyhow = "1.0.104"
jiff = "0.2.35"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
