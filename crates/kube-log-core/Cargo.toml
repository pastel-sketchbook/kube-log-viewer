[package]
name = "kube-log-core"
version = "0.5.10"
edition = "2024"
description = "Shared library for Kubernetes log fetching, streaming, and parsing"

[dependencies]
anyhow = "1.0.104"
jiff = { version = "0.2.35", features = ["serde"] }
futures = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", features = ["client", "config", "runtime", "rustls-tls"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
